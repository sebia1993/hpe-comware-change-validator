name: Windows 검증

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "portfolio/**"

permissions:
  contents: read

concurrency:
  group: hpe-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

defaults:
  run:
    shell: pwsh
    working-directory: backbone_state_tracker

jobs:
  build:
    name: 테스트 및 Windows 통합 패키지 빌드
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backbone_state_tracker
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backbone_state_tracker/requirements-windows.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "잠금 의존성 설치 실패: $LASTEXITCODE" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "의존성 정합성 검사 실패: $LASTEXITCODE" }

      - name: Run regression and security checks
        run: |
          python -m compileall app.py webapp_launcher.py core tests tools
          if ($LASTEXITCODE -ne 0) { throw "compileall 실패: $LASTEXITCODE" }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "회귀 테스트 실패: $LASTEXITCODE" }
          python app.py --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke 실패: $LASTEXITCODE" }
          python webapp_launcher.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "웹앱 smoke 실패: $LASTEXITCODE" }
          python app.py --diagnose --self-check
          if ($LASTEXITCODE -ne 0) { throw "합성 진단 실패: $LASTEXITCODE" }
          python -m ruff check --select F app.py webapp_launcher.py core tests tools
          if ($LASTEXITCODE -ne 0) { throw "Pyflakes 검사 실패: $LASTEXITCODE" }
          python -m ruff check --select F,I core/command_safety.py core/collector.py core/preflight.py core/mockserver/runner.py core/mockserver/ssh_server.py tests/test_collection_security.py tests/test_mock_collector_integration.py tests/test_mock_ssh_server.py tests/test_preflight.py tests/test_release_assets.py tests/test_release_package_verifier.py tools/stamp_sbom_identity.py tools/verify_release_assets.py tools/verify_release_package.py tools/write_release_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "변경 경계 Ruff 검사 실패: $LASTEXITCODE" }
          python -m bandit -q -lll -r app.py webapp_launcher.py core -x tests
          if ($LASTEXITCODE -ne 0) { throw "Bandit 검사 실패: $LASTEXITCODE" }
          python -m pip_audit -r requirements-runtime.lock --require-hashes --ignore-vuln GHSA-r374-rxx8-8654
          if ($LASTEXITCODE -ne 0) { throw "의존성 보안 검사 실패: $LASTEXITCODE" }

      - name: Build Windows integrated ZIP
        run: |
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\build_windows_exe.ps1 -SkipTests -ReleaseTag v0.9.0
          if ($LASTEXITCODE -ne 0) { throw "Windows 통합 ZIP 빌드 실패: $LASTEXITCODE" }

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements-runtime.lock --output-reproducible --spec-version 1.6 --output-format JSON --output-file dist/backbone_state_tracker_v0.9.0_sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM 생성 실패: $LASTEXITCODE" }
          python .\tools\stamp_sbom_identity.py `
            --sbom dist/backbone_state_tracker_v0.9.0_sbom.cdx.json `
            --repository "${{ github.repository }}" `
            --application backbone_state_tracker `
            --version v0.9.0 `
            --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "SBOM 결정 식별자 기록 실패: $LASTEXITCODE" }

      - name: Verify candidate assets independently
        run: |
          python .\tools\verify_release_assets.py `
            --zip dist/backbone_state_tracker_v0.9.0_windows.zip `
            --checksum dist/backbone_state_tracker_v0.9.0_windows.zip.sha256.txt `
            --manifest dist/backbone_state_tracker_v0.9.0_release_manifest.txt `
            --sbom dist/backbone_state_tracker_v0.9.0_sbom.cdx.json `
            --version v0.9.0 `
            --repository "${{ github.repository }}" `
            --application backbone_state_tracker `
            --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "후보 자산 검증 실패: $LASTEXITCODE" }

      - name: Preserve candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpe-comware-v0.9.0-candidate-${{ github.run_id }}
          path: backbone_state_tracker/dist/**
          if-no-files-found: error
          retention-days: 7

  public-demo:
    name: Public Streamlit fixture and interaction tests
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -r portfolio_demo/requirements.txt
      - run: python -m unittest discover -s portfolio_demo -p test_demo.py -v

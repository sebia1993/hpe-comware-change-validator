name: Windows v0.9.0 릴리스

on:
  workflow_dispatch:
    inputs:
      version:
        description: "앱 버전과 일치하는 정식 태그"
        required: true
        default: "v0.9.0"

permissions:
  contents: read

concurrency:
  group: hpe-comware-release
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

defaults:
  run:
    shell: pwsh
    working-directory: backbone_state_tracker

jobs:
  release:
    name: 검증, Windows 빌드, 증명, 게시
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: backbone_state_tracker
          persist-credentials: false

      - name: Require current main branch
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Release는 main 브랜치에서만 실행할 수 있습니다."
          }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backbone_state_tracker/requirements-windows.lock

      - name: Resolve immutable release metadata
        id: release_meta
        env:
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          $appVersion = (python -c "from core.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "앱 버전을 읽지 못했습니다." }
          $expectedTag = "v$appVersion"
          if ($env:REQUESTED_TAG -ne $expectedTag) {
            throw "요청 태그 $env:REQUESTED_TAG 와 앱 버전 $expectedTag 가 다릅니다."
          }
          if ($expectedTag -notmatch '^v\d+\.\d+\.\d+$') { throw "정식 SemVer 태그가 아닙니다." }
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT
          "zip_path=dist/backbone_state_tracker_${expectedTag}_windows.zip" >> $env:GITHUB_OUTPUT
          "checksum_path=dist/backbone_state_tracker_${expectedTag}_windows.zip.sha256.txt" >> $env:GITHUB_OUTPUT
          "manifest_path=dist/backbone_state_tracker_${expectedTag}_release_manifest.txt" >> $env:GITHUB_OUTPUT
          "sbom_path=dist/backbone_state_tracker_${expectedTag}_sbom.cdx.json" >> $env:GITHUB_OUTPUT

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "잠금 의존성 설치 실패: $LASTEXITCODE" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "의존성 정합성 검사 실패: $LASTEXITCODE" }

      - name: Run source, security, and smoke checks
        run: |
          python -m compileall app.py webapp_launcher.py core tests tools
          if ($LASTEXITCODE -ne 0) { throw "compileall 실패: $LASTEXITCODE" }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "회귀 테스트 실패: $LASTEXITCODE" }
          python app.py --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke 실패: $LASTEXITCODE" }
          python webapp_launcher.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "웹앱 smoke 실패: $LASTEXITCODE" }
          python app.py --diagnose --self-check
          if ($LASTEXITCODE -ne 0) { throw "합성 진단 실패: $LASTEXITCODE" }
          python -m ruff check --select F app.py webapp_launcher.py core tests tools
          if ($LASTEXITCODE -ne 0) { throw "Pyflakes 검사 실패: $LASTEXITCODE" }
          python -m ruff check --select F,I core/command_safety.py core/collector.py core/preflight.py core/mockserver/runner.py core/mockserver/ssh_server.py tests/test_collection_security.py tests/test_mock_collector_integration.py tests/test_mock_ssh_server.py tests/test_preflight.py tests/test_release_assets.py tests/test_release_package_verifier.py tools/stamp_sbom_identity.py tools/verify_release_assets.py tools/verify_release_package.py tools/write_release_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "변경 경계 Ruff 검사 실패: $LASTEXITCODE" }
          python -m bandit -q -lll -r app.py webapp_launcher.py core -x tests
          if ($LASTEXITCODE -ne 0) { throw "Bandit 검사 실패: $LASTEXITCODE" }
          python -m pip_audit -r requirements-runtime.lock --require-hashes --ignore-vuln GHSA-r374-rxx8-8654
          if ($LASTEXITCODE -ne 0) { throw "의존성 보안 검사 실패: $LASTEXITCODE" }

      - name: Build Windows integrated ZIP
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\build_windows_exe.ps1 -SkipTests -ReleaseTag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Windows 통합 ZIP 빌드 실패: $LASTEXITCODE" }

      - name: Generate reproducible and attestable CycloneDX SBOM
        env:
          SBOM_PATH: ${{ steps.release_meta.outputs.sbom_path }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cyclonedx-py requirements requirements-runtime.lock --output-reproducible --spec-version 1.6 --output-format JSON --output-file $env:SBOM_PATH
          if ($LASTEXITCODE -ne 0) { throw "SBOM 생성 실패: $LASTEXITCODE" }
          python .\tools\stamp_sbom_identity.py `
            --sbom $env:SBOM_PATH `
            --repository $env:RELEASE_REPOSITORY `
            --application backbone_state_tracker `
            --version $env:RELEASE_TAG `
            --source-commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "SBOM 결정 식별자 기록 실패: $LASTEXITCODE" }

      - name: Verify release assets independently
        env:
          ZIP_PATH: ${{ steps.release_meta.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.release_meta.outputs.checksum_path }}
          MANIFEST_PATH: ${{ steps.release_meta.outputs.manifest_path }}
          SBOM_PATH: ${{ steps.release_meta.outputs.sbom_path }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          python .\tools\verify_release_assets.py `
            --zip $env:ZIP_PATH `
            --checksum $env:CHECKSUM_PATH `
            --manifest $env:MANIFEST_PATH `
            --sbom $env:SBOM_PATH `
            --version $env:RELEASE_TAG `
            --repository "${{ github.repository }}" `
            --application backbone_state_tracker `
            --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "릴리스 자산 묶음 검증 실패: $LASTEXITCODE" }

      - name: Attest ZIP build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: backbone_state_tracker/${{ steps.release_meta.outputs.zip_path }}

      - name: Attest runtime SBOM
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: backbone_state_tracker/${{ steps.release_meta.outputs.zip_path }}
          sbom-path: backbone_state_tracker/${{ steps.release_meta.outputs.sbom_path }}

      - name: Create or validate annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw "Git 인증 설정 실패: $LASTEXITCODE" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw "원격 태그 조회 실패: $LASTEXITCODE" }
          git rev-parse -q --verify "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            if ((git cat-file -t "refs/tags/$env:RELEASE_TAG").Trim() -ne "tag") {
              throw "기존 태그는 annotated tag가 아닙니다."
            }
            if ((git rev-list -n 1 $env:RELEASE_TAG).Trim() -ne "${{ github.sha }}") {
              throw "기존 태그가 현재 검증 커밋을 가리키지 않습니다."
            }
          } else {
            git tag -a $env:RELEASE_TAG "${{ github.sha }}" -m "HPE Comware Change Validator $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "annotated tag 생성 실패: $LASTEXITCODE" }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "annotated tag 게시 실패: $LASTEXITCODE" }
          }

      - name: Write Korean release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          ZIP_PATH: ${{ steps.release_meta.outputs.zip_path }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom_attestation.outputs.attestation-url }}
        run: |
          $zipName = Split-Path $env:ZIP_PATH -Leaf
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:ZIP_PATH).Hash.ToLowerInvariant()
          $notesPath = Join-Path $env:RUNNER_TEMP "hpe-comware-release-notes.md"
          @"
          # HPE Comware 변경 검증기 $env:RELEASE_TAG

          ## 이번 릴리즈
          - 읽기 전용 명령을 실행 직전 중앙 경계에서 정규화하고, 안전성을 입증하지 못하면 접속 전에 차단합니다.
          - 승인된 SSH 호스트 키만 허용하고 ssh-rsa 호스트 키·공개키 인증을 모두 비활성화합니다.
          - Netmiko 4.7.0/Paramiko 4.0.0을 포함한 전체 의존성을 해시 잠금했습니다.

          ## 검증 결과
          - 기준 커밋: ${{ github.sha }}
          - Windows 회귀·smoke·합성 진단·PyInstaller 빌드·자산 검증 통과
          - SHA-256: $checksum
          - Build provenance: $env:PROVENANCE_URL
          - SBOM attestation: $env:SBOM_ATTESTATION_URL

          ## 다운로드
          - Windows ZIP: $zipName
          - SHA-256 sidecar, 릴리스 manifest, CycloneDX 1.6 SBOM을 함께 제공합니다.

          ## 운영 영향과 한계
          - gui\config\known_hosts에 별도 채널로 확인한 호스트 키를 등록해야 실제 장비 수집이 시작됩니다.
          - ssh-rsa만 제공하는 장비에는 보안 정책을 낮추지 않고 연결을 실패시킵니다.
          - 자동·Mock·Windows CI 결과이며 실제 운영 장비 호환성이나 현장 성과를 주장하지 않습니다.
          - 비교 결과는 변경 검증을 보조하며 서비스 정상성이나 장애 원인을 자동 확정하지 않습니다.
          "@ | Set-Content -LiteralPath $notesPath -Encoding UTF8
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          ZIP_PATH: ${{ steps.release_meta.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.release_meta.outputs.checksum_path }}
          MANIFEST_PATH: ${{ steps.release_meta.outputs.manifest_path }}
          SBOM_PATH: ${{ steps.release_meta.outputs.sbom_path }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "동일한 Release가 이미 있습니다: $env:RELEASE_TAG" }
          gh release create $env:RELEASE_TAG `
            $env:ZIP_PATH `
            $env:CHECKSUM_PATH `
            $env:MANIFEST_PATH `
            $env:SBOM_PATH `
            --verify-tag `
            --title "HPE Comware 변경 검증기 $env:RELEASE_TAG" `
            --notes-file "${{ steps.notes.outputs.path }}" `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 게시 실패: $LASTEXITCODE" }

      - name: Preserve prepared evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hpe-comware-${{ steps.release_meta.outputs.tag }}-evidence-${{ github.run_id }}
          path: backbone_state_tracker/dist/**
          if-no-files-found: warn
          retention-days: 14
